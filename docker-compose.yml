services:

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama-pull:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ollama pull llama3.2
    depends_on:
      ollama:
        condition: service_healthy

  rag-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2
      CHROMA_DB_PATH: /app/data/chroma_db
      SQLITE_DB_PATH: /app/data/sites.db
      ADMIN_SECRET: admin123
      DEFAULT_MESSAGE_LIMIT: 100
    volumes:
      - rag_data:/app/data
    depends_on:
      ollama:
        condition: service_healthy

  streamlit:
    build: .
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2
    volumes:
      - streamlit_chroma:/app/chroma_db
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data:
  rag_data:
  streamlit_chroma:
