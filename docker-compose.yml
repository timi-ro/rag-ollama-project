version: '3.8'

services:

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  rag-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2
      CHROMA_DB_PATH: /app/data/chroma_db
      SQLITE_DB_PATH: /app/data/sites.db
      ADMIN_SECRET: admin123
      DEFAULT_MESSAGE_LIMIT: 100
    volumes:
      - rag_data:/app/data
    depends_on:
      - ollama

volumes:
  ollama_data:
  rag_data:
