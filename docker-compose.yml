services:

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/bash", "-c", "ollama serve & sleep 5 && ollama pull llama3.2 && wait"]
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "ollama list | grep llama3.2"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"   # REST API + dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  rag-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2
      QDRANT_URL: http://qdrant:6333
      EMBED_DIM: 3072
      SQLITE_DB_PATH: /app/data/sites.db
    env_file:
      - .env
    volumes:
      - rag_data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started

  streamlit:
    build: .
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data:
  rag_data:
  qdrant_data: